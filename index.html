<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer</title>
  <!-- PDF.js CDN Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #323639;
      font-family: Arial, sans-serif;
    }
    /* ऊपर की पट्टी (Header Bar) */
    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background-color: #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      z-index: 1000;
    }
    #top-bar span {
      font-size: 15px;
      font-weight: bold;
    }
    /* डाउनलोड बटन */
    .download-btn {
      background-color: #007bff;
      color: white;
      padding: 8px 16px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
    }
    /* PDF कंटेनर */
    #pdf-container {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
    }
    canvas {
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      max-width: 96%;
      height: auto !important;
      background-color: white;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <span>Document Viewer</span>
    <a id="download-btn" class="download-btn" href="#" download>Download PDF</a>
  </div>

  <div id="pdf-container"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // URL से PDF लिंक निकालें
    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('file');

    if (pdfUrl) {
      document.getElementById('download-btn').href = pdfUrl;

      pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
        const container = document.getElementById('pdf-container');
        
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const unscaledViewport = page.getViewport({ scale: 1 });
          
          // स्क्रीन साइज़ के हिसाब से ऑटो-एडजस्ट
          const containerWidth = Math.min(window.innerWidth, 800) - 20;
          const scale = containerWidth / unscaledViewport.width;
          const viewport = page.getViewport({ scale: scale });

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          container.appendChild(canvas);

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
        }
      }).catch(err => {
        alert("PDF लोडिंग में समस्या आई: " + err.message);
      });
    }
  </script>
</body>
</html>
